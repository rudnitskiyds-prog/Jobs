name: Обновление вакансий

on:
  schedule:
    - cron: "17 4 * * *"    # 07:17 МСК
    - cron: "43 14 * * *"   # 17:43 МСК
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scraper/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Сбор вакансий
        if: github.event_name != 'push'
        env:
          HH_TOKEN: ${{ secrets.HH_TOKEN }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m scraper.main
      - name: Сохранить данные в репозиторий
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/vacancies.json site/feed.xml
          git diff --cached --quiet || git commit -m "Обновление вакансий $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
